name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build the site for production
  build_prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: ASTRO_ENV=prod npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Build the site for testing in CI
  build_ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build site for CI
        run: ASTRO_ENV=ci npm run build

      - name: Upload CI build
        uses: actions/upload-artifact@v4
        with:
          name: site-ci
          path: dist

  # Run tests aagainst the CI build
  test:
    needs: build_ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Download ci build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-ci
          path: dist

        # Debug step to view sitemap
      - name: Debug sitemap
        run: cat dist/sitemap-0.xml

        # Use http-server because `astro preview` is not suitable for CI environments
      - name: Run pa11y-ci accessibility tests
        run: |
          npx http-server dist -p 4321 &
          npx wait-on http://localhost:4321
          npx pa11y-ci --sitemap http://localhost:4321/sitemap-0.xml --config pa11yci.json

  # Deploy the site to GitHub Pages
  deploy:
    needs: [build_prod, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
